<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 2</title>
    <style>
        ul {
            list-style-type: "» ";
            color: #0066cc; 
        }
        
        li > span {
            color: #000000; 
        }

        ul.winter { list-style-type: "❄ "; }
        ul.spring { list-style-type: "🌿 "; }
        ul.summer { list-style-type: "☀️ "; }
        ul.autumn { list-style-type: "🍁 "; }
    </style>
</head>
<body>
    <ul>
        <li><span>Winter</span>
            <ul class="winter">
                <li>December</li>
                <li>January</li>
                <li>February</li>
            </ul>
        </li>
        <li><span>Spring</span>
            <ul class="spring">
                <li>March</li>
                <li>April</li>
                <li>May</li>
            </ul>
        </li> 
        <li><span>Summer</span>
            <ul class="summer">
                <li>June</li>
                <li>July</li>
                <li>August</li>
            </ul>
        </li>
        <li><span>Autumn</span>
            <ul class="autumn">
                <li>September</li>
                <li>October</li>
                <li>November</li>
            </ul>
        </li>
    </ul>
</body>
</html>
