<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

    <style>
        ol {
            text-align: left;
            background-color: #f0c4c4;
            padding: 20px;
            margin: 25px;
            color: white;
        }
        li {
            background-color: #d98b8b;
            margin: 10px;
            padding: 10px;
            
        }
        li span {
            background-color: #8b4a4a;
            padding: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
   <ol>
        <li>1. <span>Apple</span></li>
        <li>2. <span>Orange</span></li>
        <li>3. <span>Pineapple</span></li>
        <li>4. <span>Pear</span></li>
        <li>5. <span>Cherry</span></li>
    </ol>
</body>
</html>
