<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стулки</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .doors {
            position: relative;
            width: 530px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f4f4;
            perspective: 900px;
        }

        .message {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            color: #111;
        }

        .door {
            position: absolute;
            top: 25px;
            width: 220px;
            height: 150px;
            background-color: #3b82a0;
            border: 4px solid #174b63;
            z-index: 1;
            transition: none;
        }

        .left-door {
            left: 31px;
            transform-origin: left center;
        }

        .right-door {
            right: 31px;
            transform-origin: right center;
        }

        .doors:hover .left-door {
            transform: rotateY(-60deg);
            transition: transform 2s;
        }

        .doors:hover .right-door {
            transform: rotateY(60deg);
            transition: transform 2s;
        }
    </style>
</head>
<body>

    <div class="doors">
        <div class="message">HELLO</div>
        <div class="door left-door"></div>
        <div class="door right-door"></div>
    </div>

</body>
</html>
