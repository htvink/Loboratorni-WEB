<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея зображень</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery">
        <!-- Контейнер для великих зображень -->
        <div class="big-images">
            <img id="img1" src="img/1.jpg" alt="Фото 1">
            <img id="img2" src="img/2.jpg" alt="Фото 2">
            <img id="img3" src="img/3.jpg" alt="Фото 3">
            <img id="img4" src="img/4.jpg" alt="Фото 4">
            <img id="img5" src="img/5.jpg" alt="Фото 5">
        </div>

        <!-- Контейнер для нижніх прев'ю-посилань -->
        <div class="thumbnails">
            <a href="#img1"><img src="img/1.jpg" alt="Мініатюра 1"></a>
            <a href="#img2"><img src="img/2.jpg" alt="Мініатюра 2"></a>
            <a href="#img3"><img src="img/3.jpg" alt="Мініатюра 3"></a>
            <a href="#img4"><img src="img/4.jpg" alt="Мініатюра 4"></a>
            <a href="#img5"><img src="img/5.jpg" alt="Мініатюра 5"></a>
        </div>
    </div>

</body>
</html>
