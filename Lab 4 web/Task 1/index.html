<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кулер процесора</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <article class="cooler-card">
        <img class="cooler-card__image"
             src="cooler.jpg"
             alt="Система охолодження процесора">

        <h2 class="cooler-card__title">DeepCool AK400</h2>

        <div class="cooler-card__properties">
            <p class="cooler-card__property">
                <span class="cooler-card__label">Тип:</span> повітряна
            </p>
            <p class="cooler-card__property">
                <span class="cooler-card__label">Розсіювана потужність:</span> 220 Вт
            </p>
            <p class="cooler-card__property">
                <span class="cooler-card__label">Рівень шуму:</span> 29 дБ
            </p>
            <p class="cooler-card__property">
                <span class="cooler-card__label">Матеріал радіатора:</span> алюміній
            </p>
        </div>

        <div class="cooler-card__buttons">
            <button class="cooler-card__button cooler-card__button--edit">
                Edit
            </button>
            <button class="cooler-card__button cooler-card__button--delete">
                Delete
            </button>
        </div>
    </article>

</body>
</html>
